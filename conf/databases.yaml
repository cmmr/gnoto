    release: mpa_vJun23_CHOCOPhlAnSGB_202403
    description: 'MetaPhlAn 4 SGB marker database: the bowtie2 index, the pickled marker metadata, and the SGB phylogeny (.nwk). The newest release MetaPhlAn 4.1.1 reads, and the one HUMAnN 3.9 accepts profiles from.'
    used_by:
      - 'taxprofiler: pipelines/taxprofiler/database.csv (metaphlan)'
      - 'biobakery: metaphlan_db'
    setup: steps/fetch_taxprofiler_db.sh metaphlan
    manifest: metaphlan/mpa_vJun23_CHOCOPhlAnSGB_202403.manifest.json
    sources:
      - url: https://cmprod1.cibio.unitn.it/biobakery4/metaphlan_databases/bowtie2_indexes/mpa_vJun23_CHOCOPhlAnSGB_202403_bt2.tar
      - url: https://cmprod1.cibio.unitn.it/biobakery4/metaphlan_databases/mpa_vJun23_CHOCOPhlAnSGB_202403.tar
      - url: https://cmprod1.cibio.unitn.it/biobakery4/metaphlan_databases/mpa_vJun23_CHOCOPhlAnSGB_202403.nwk
    doi: null
    cite:
