# databases.yaml - Every database and reference gnoto reads, by its path under
# core.db_dir. Each entry says what reads it, what it's built from, the command
# that builds it, the dataset DOI where there is one, and the references.yaml ids
# to cite it by. A pipeline names one as db:<path>.
#
# An entry with a choice stands in for a reference a pipeline would otherwise
# download, such as ampliseq's dada_ref_taxonomy: the job passes its params
# instead, as local files.
#
# fixtures, at the end, are the public test data from docs/fixtures.md, fetched
# into fixtures/<name>/v1/.

databases:
  - path: dada2/silva-138.2
    name: SILVA 138.2 for DADA2
    release: "138.2"
    description: The DADA2-formatted SILVA 138.2 prokaryotic SSU training set, to species, and its species-assignment set.
    used_by:
      - 'ampliseq: dada_ref_tax_custom, dada_ref_tax_custom_sp'
    choice:
      parameter: dada_ref_taxonomy
      value: "silva=138.2"
      params:
        dada_ref_tax_custom: db:dada2/silva-138.2/silva_nr99_v138.2_toSpecies_trainset.fa.gz
        dada_ref_tax_custom_sp: db:dada2/silva-138.2/silva_v138.2_assignSpecies.fa.gz
        dada_assign_taxlevels: Domain,Phylum,Class,Order,Family,Genus,Species
    files:
      - url: https://zenodo.org/records/14169026/files/silva_nr99_v138.2_toSpecies_trainset.fa.gz
        md5: e0455a1a7de820039d684aad2053e937
        bytes: 141016498
      - url: https://zenodo.org/records/14169026/files/silva_v138.2_assignSpecies.fa.gz
        md5: 62fd939bd1aa9832d2089847f9f0b87d
        bytes: 69899323
    doi: 10.5281/zenodo.14169026
    cite:
      - callahan2024
      - quast2013
  - path: kraken2/pluspf_20260626
    name: Kraken2/Bracken PlusPF
    release: "2026-06-26"
    description: RefSeq archaea, bacteria, viruses, plasmids, human, UniVec_Core, protozoa and fungi, with nodes.dmp and names.dmp and Bracken distributions for 50-300-mers.
    used_by:
      - 'taxprofiler: pipelines/taxprofiler/database.csv (kraken2, bracken), taxpasta_taxonomy_dir'
    setup: steps/fetch_taxprofiler_db.sh kraken2
    manifest: kraken2/pluspf_20260626.manifest.json
    sources:
      - url: https://genome-idx.s3.amazonaws.com/kraken/k2_pluspf_20260626.tar.gz
        checksums: https://genome-idx.s3.amazonaws.com/kraken/pluspf_20260626/pluspf.md5
    homepage: https://benlangmead.github.io/aws-indexes/k2
    doi: null
    cite:
      - wood2019
      - lu2017
  - path: metaphlan/mpa_vJun23_CHOCOPhlAnSGB_202403
