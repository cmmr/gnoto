    release: v1.1
    description: 'Marker-MAGu_markerDB.fna, a 10.5 GB multi-FASTA of species-level marker genes: MetaPhlAn 4''s vOct22 markers for bacteria, archaea and microeukaryotes, with marker genes of the 49,111 phage taxa of the Trove of Gut Virus Genomes v1.1 added. Each header reads gene_name;lineage;genome_name.'
