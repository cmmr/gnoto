# slurm.conf - One node, one partition, for the gnoto test bed.
ClusterName=testbed
SlurmctldHost=testbed
SlurmUser=slurm
AuthType=auth/munge

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
# Without a default, a job that asks for no memory gets the whole node
DefMemPerCPU=2000
# Schedules often, so a pipeline's many short tasks don't wait between them
SchedulerParameters=sched_interval=5,bf_interval=5

ReturnToService=2
KillWait=30
MinJobAge=600

NodeName=testbed CPUs=6 RealMemory=24000 State=UNKNOWN
PartitionName=main Nodes=testbed Default=YES MaxTime=7-00:00:00 State=UP
