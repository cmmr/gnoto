# sqs.yaml - The queue that carries Wrike's webhook and the dashboards'
# requests for Globus access to gnoto's listener, with the Lambdas that check
# each request and the HTTP APIs that take them.
#
# Deployed by:  gnoto config sqs --deploy, as the stack gnoto-sqs, which fills
#               in the Lambdas' code from service/aws/lambda/webhook.py and
#               access.py
# Parameters:   WebhookSecret (wrike.webhook_secret) and IamStack (gnoto-iam);
#               and for Get the data, GlobusClientId (globus.app_client_id),
#               ResultsBucket (aws.s3_bucket), RunPrefix (aws.run_prefix),
#               ResultsOrigin, the scheme and host of aws.results_base_url, and
#               RedirectUri, <results_base_url>/<run_prefix>/access.html
# Outputs:      QueueUrl, WebhookUrl and, with Get the data, AccessUrl, which
#               config writes to generated.yaml, and which gnoto config wrike
#               registers the webhook with
#
# The queue keeps a message 14 days, the most SQS allows, and hides one the
# listener is handling for 10 minutes, longer than starting a request takes.
# Get the data's Lambda and API are made only when GlobusClientId and
# ResultsBucket are set. Its API answers only pages from the results' origin,
# and the Lambda may read only each run's globus.json. The Lambdas run
# python3.14: python3.15 is a public preview, which AWS says isn't for
# production, until it's generally available.

AWSTemplateFormatVersion: "2010-09-09"
Description: gnoto's queue for Wrike's webhook and Globus access requests, their Lambdas and HTTP APIs

Parameters:
  WebhookSecret:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: The secret Wrike signs each request with, wrike.webhook_secret
  IamStack:
    Type: String
    Default: gnoto-iam
    Description: The stack holding gnoto's IAM user
  GlobusClientId:
    Type: String
    Default: ""
    Description: The dashboards' Globus app, globus.app_client_id, or none for no Get the data
  ResultsBucket:
    Type: String
    Default: ""
    Description: The results bucket, aws.s3_bucket
  RunPrefix:
    Type: String
    Default: gnoto
    AllowedPattern: "[A-Za-z0-9._-]+"
    Description: The folder in the bucket that runs go under, aws.run_prefix
  ResultsOrigin:
    Type: String
    Default: ""
    Description: The scheme and host the dashboards are served from
  RedirectUri:
    Type: String
    Default: ""
    Description: The page Globus's sign-in returns to, <results_base_url>/<run_prefix>/access.html

Conditions:
  Access: !Not [!Or [!Equals [!Ref GlobusClientId, ""], !Equals [!Ref ResultsBucket, ""]]]

Resources:
  Queue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      Tags:
        - Key: app
          Value: gnoto

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: send-to-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt Queue.Arn

  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-webhook"
      RetentionInDays: 30

  Function:
    Type: AWS::Lambda::Function
    DependsOn: FunctionLogs
    Properties:
      FunctionName: !Sub "${AWS::StackName}-webhook"
      Description: Checks Wrike's webhook signature and queues the events for gnoto
      Runtime: python3.14
      Architectures: [arm64]
      Handler: index.lambda_handler
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt FunctionRole.Arn
      Environment:
        Variables:
          AWS_SQS_QUEUE_URL: !Ref Queue
          WRIKE_WEBHOOK_SECRET: !Ref WebhookSecret
      Code:
        ZipFile: |
          __WEBHOOK_PY__

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-webhook"
      Description: Where Wrike posts gnoto's webhook events
      ProtocolType: HTTP
      RouteKey: POST /wrike
      Target: !GetAtt Function.Arn

  ApiInvokes:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"

  AccessRole:
    Type: AWS::IAM::Role
    Condition: Access
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: queue-and-markers
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt Queue.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ResultsBucket}/${RunPrefix}/*/globus.json"

  AccessLogs:
    Type: AWS::Logs::LogGroup
    Condition: Access
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-access"
      RetentionInDays: 30

  AccessFunction:
    Type: AWS::Lambda::Function
    Condition: Access
    DependsOn: AccessLogs
    Properties:
      FunctionName: !Sub "${AWS::StackName}-access"
      Description: Finishes a dashboard reader's Globus sign-in and queues their identity for gnoto
      Runtime: python3.14
      Architectures: [arm64]
      Handler: index.lambda_handler
      MemorySize: 128
      Timeout: 25
      Role: !GetAtt AccessRole.Arn
      Environment:
        Variables:
          AWS_SQS_QUEUE_URL: !Ref Queue
          RESULTS_BUCKET: !Ref ResultsBucket
          RUN_PREFIX: !Ref RunPrefix
          GLOBUS_CLIENT_ID: !Ref GlobusClientId
          REDIRECT_URI: !Ref RedirectUri
      Code:
        ZipFile: |
          __ACCESS_PY__

  AccessApi:
    Type: AWS::ApiGatewayV2::Api
    Condition: Access
    Properties:
      Name: !Sub "${AWS::StackName}-access"
      Description: Where a dashboard posts a reader's Globus sign-in
      ProtocolType: HTTP
      RouteKey: POST /access
      Target: !GetAtt AccessFunction.Arn
      CorsConfiguration:
        AllowOrigins:
          - !Ref ResultsOrigin
        AllowMethods: [POST]
        AllowHeaders: [content-type]
        MaxAge: 3600

  AccessApiInvokes:
    Type: AWS::Lambda::Permission
    Condition: Access
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AccessFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AccessApi}/*"

  UserPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-queue"
      Users:
        - Fn::ImportValue: !Sub "${IamStack}-UserName"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadQueue
            Effect: Allow
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
            Resource: !GetAtt Queue.Arn

Outputs:
  QueueUrl:
    Description: The queue the listener reads, aws.sqs_queue_url
    Value: !Ref Queue
  WebhookUrl:
    Description: Where Wrike posts, aws.webhook_url
    Value: !Sub "${Api.ApiEndpoint}/wrike"
  AccessUrl:
    Condition: Access
    Description: Where a dashboard posts a Globus sign-in, aws.access_url
    Value: !Sub "${AccessApi.ApiEndpoint}/access"
