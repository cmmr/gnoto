# sqs.yaml - The queue that carries Wrike's webhook to gnoto's listener, with
# the Lambda that checks each request and the HTTP API Wrike posts to.
#
# Deployed by:  gnoto config sqs --deploy, as the stack gnoto-sqs, which fills
#               in the Lambda's code from service/aws/lambda/webhook.py
# Parameters:   WebhookSecret (wrike.webhook_secret) and IamStack (gnoto-iam)
# Outputs:      QueueUrl and WebhookUrl, which config writes to generated.yaml,
#               and which gnoto config wrike registers the webhook with
#
# The queue keeps a message 14 days, the most SQS allows, and hides one the
# listener is handling for 10 minutes, longer than starting a request takes.
# The Lambda runs python3.14: python3.15 is a public preview, which AWS says
# isn't for production, until it's generally available.

AWSTemplateFormatVersion: "2010-09-09"
Description: gnoto's queue for Wrike's webhook, its Lambda and its HTTP API

Parameters:
  WebhookSecret:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: The secret Wrike signs each request with, wrike.webhook_secret
  IamStack:
    Type: String
    Default: gnoto-iam
    Description: The stack holding gnoto's IAM user

Resources:
  Queue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      Tags:
        - Key: app
          Value: gnoto

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: send-to-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt Queue.Arn

  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-webhook"
      RetentionInDays: 30

  Function:
    Type: AWS::Lambda::Function
    DependsOn: FunctionLogs
    Properties:
      FunctionName: !Sub "${AWS::StackName}-webhook"
      Description: Checks Wrike's webhook signature and queues the events for gnoto
      Runtime: python3.14
      Architectures: [arm64]
      Handler: index.lambda_handler
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt FunctionRole.Arn
      Environment:
        Variables:
          AWS_SQS_QUEUE_URL: !Ref Queue
          WRIKE_WEBHOOK_SECRET: !Ref WebhookSecret
      Code:
        ZipFile: |
          __WEBHOOK_PY__

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-webhook"
      Description: Where Wrike posts gnoto's webhook events
      ProtocolType: HTTP
      RouteKey: POST /wrike
      Target: !GetAtt Function.Arn

  ApiInvokes:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"

  UserPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-queue"
      Users:
        - Fn::ImportValue: !Sub "${IamStack}-UserName"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadQueue
            Effect: Allow
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
            Resource: !GetAtt Queue.Arn

Outputs:
  QueueUrl:
    Description: The queue the listener reads, aws.sqs_queue_url
    Value: !Ref Queue
  WebhookUrl:
    Description: Where Wrike posts, aws.webhook_url
    Value: !Sub "${Api.ApiEndpoint}/wrike"
