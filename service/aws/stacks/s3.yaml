# s3.yaml - The bucket gnoto publishes results to, and the CloudFront
# distribution that serves them.
#
# Deployed by:  gnoto config s3 --deploy, as the stack gnoto-s3, which fills in
#               the CloudFront function's code from
#               service/aws/cloudfront/directory-index.js
# Parameters:   BucketName, RunPrefix (aws.run_prefix), IamStack (gnoto-iam),
#               and for a custom domain, DomainName and CertificateArn, an ACM
#               certificate in us-east-1, whose DNS record points the domain at
#               the distribution. Both are made by hand.
# Outputs:      ResultsBaseUrl and DistributionId, which config writes to
#               generated.yaml
#
# The bucket is private: CloudFront reads it through an origin access control,
# and gnoto's IAM user may write only under the run prefix. A page is uploaded
# with Cache-Control: no-cache, so a progress page that becomes a dashboard is
# never served stale; anything else is cached for at most five minutes unless
# it says otherwise, so a run's removed results soon leave the edge too.
# Deleting the stack fails while the bucket holds anything, which keeps the
# results from going with it by accident.

AWSTemplateFormatVersion: "2010-09-09"
Description: gnoto's results bucket and the CloudFront distribution that serves it

Parameters:
  BucketName:
    Type: String
    Description: The bucket's name, aws.s3_bucket
  RunPrefix:
    Type: String
    Default: gnoto
    AllowedPattern: "[A-Za-z0-9._-]+"
    Description: The folder in the bucket that runs go under, aws.run_prefix
  IamStack:
    Type: String
    Default: gnoto-iam
    Description: The stack holding gnoto's IAM user
  DomainName:
    Type: String
    Default: ""
    Description: A custom domain for the results, or empty for CloudFront's own
  CertificateArn:
    Type: String
    Default: ""
    Description: The custom domain's ACM certificate, in us-east-1
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]

Conditions:
  CustomDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: app
          Value: gnoto

  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-bucket"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DirectoryIndex:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-directory-index"
      AutoPublish: true
      FunctionConfig:
        Comment: Serves a folder's page for a folder's address
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        __DIRECTORY_INDEX_JS__

  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-results"
        DefaultTTL: 300
        MinTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  Distribution:
    Type: AWS::CloudFront::Distribution
    # CertificateArn is empty unless there's a custom domain, and only used then
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      DistributionConfig:
        Comment: gnoto's published results
        Enabled: true
        HttpVersion: http2and3
        PriceClass: !Ref PriceClass
        Aliases: !If [CustomDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - CustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: results
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: results
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref CachePolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DirectoryIndex.FunctionMetadata.FunctionARN

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReads
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  UserPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-results"
      Users:
        - Fn::ImportValue: !Sub "${IamStack}-UserName"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ListRuns
            Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt Bucket.Arn
            Condition:
              StringLike:
                s3:prefix: [!Sub "${RunPrefix}/*"]
          - Sid: WriteRuns
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
            Resource: !Sub "${Bucket.Arn}/${RunPrefix}/*"

Outputs:
  BucketName:
    Value: !Ref Bucket
  ResultsBaseUrl:
    Description: Where the results are served from, aws.results_base_url
    Value: !If
      - CustomDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${Distribution.DomainName}"
  DistributionDomain:
    Description: Where a custom domain's DNS record points
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
